{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edupay</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/logo.ico' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/staff_dashboard.css' %}">
</head>
<body>

  <!-- ═══ Red Navbar ═══ -->
  <nav class="navbar-red">
    <div class="container">
      <a href="/" class="nav-brand">
        <img src="{% static 'images/logo.png' %}" alt="Edupay" class="nav-brand-img">
        <div class="nav-brand-text">
          <span>EduPay <strong>Malawi</strong></span>
          <small>Pay Fast, Pay Smart</small>
        </div>
      </a>
      <button class="nav-toggle-red" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links-red" id="navLinks">
        <a href="/school/login/"><i class="fa-solid fa-user-shield"></i> Staff</a>
        <a href="#" id="parentLoginBtn"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        <a href="#" id="parentLogoutLink" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>
    </div>
  </nav>

  <!-- ═══ App Content ═══ -->
  <div id="app-content"></div>

  <!-- ═══ Login Modal ═══ -->
  <div class="modal-overlay" id="parentLoginOverlay"></div>
  <div class="modal" id="parentLoginModal">
    <div class="modal-header">
      <h3>Parent Login</h3>
      <button class="modal-close modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <div class="auth-phone-group">
          <span class="auth-phone-prefix">+265</span>
          <input type="tel" class="form-input auth-phone-input" id="parentLoginPhone" placeholder="Enter phone" maxlength="9">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="auth-password-group">
          <input type="password" class="form-input" id="parentLoginPassword" placeholder="Enter password">
          <button type="button" class="password-toggle" data-target="parentLoginPassword"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="form-error" id="parentLoginError"></div>
    </div>
    <div class="modal-footer" style="justify-content:space-between;">
      <span style="font-size:0.82rem;color:var(--text-muted);">Don't have an account? <a href="#" id="parentSignupFromLogin" style="color:var(--primary);font-weight:600;">Sign up</a></span>
      <button class="btn btn-primary" id="parentLoginSaveBtn">Login</button>
    </div>
  </div>

  <!-- ═══ Signup Modal ═══ -->
  <div class="modal-overlay" id="parentSignupOverlay"></div>
  <div class="modal" id="parentSignupModal">
    <div class="modal-header">
      <h3>Create Parent Account</h3>
      <button class="modal-close modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" class="form-input" id="parentSignupFirst" placeholder="Enter first name">
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-input" id="parentSignupLast" placeholder="Enter last name">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="parentSignupEmail" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <div class="auth-phone-group">
          <span class="auth-phone-prefix">+265</span>
          <input type="tel" class="form-input auth-phone-input" id="parentSignupPhone" placeholder="Enter phone" maxlength="9">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="auth-password-group">
          <input type="password" class="form-input" id="parentSignupPassword" placeholder="Enter password (min 6 chars)">
          <button type="button" class="password-toggle" data-target="parentSignupPassword"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="auth-password-group">
          <input type="password" class="form-input" id="parentSignupConfirm" placeholder="Confirm password">
          <button type="button" class="password-toggle" data-target="parentSignupConfirm"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="form-error" id="parentSignupError"></div>
    </div>
    <div class="modal-footer" style="justify-content:space-between;">
      <span style="font-size:0.82rem;color:var(--text-muted);">Already have an account? <a href="#" id="parentLoginFromSignup" style="color:var(--primary);font-weight:600;">Login</a></span>
      <button class="btn btn-primary" id="parentSignupSaveBtn">Create Account</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/parent_payment_manager.js' %}"></script>
  <script src="{% static 'js/parent_school_manager.js' %}"></script>
  <script src="{% static 'js/parent_main.js' %}"></script>
</body>
</html>
