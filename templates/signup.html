{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headteacher Registration - Edupay</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/logo.ico' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="{% static 'images/logo.png' %}" alt="Edupay" class="auth-logo-img">
        <div class="auth-logo-text">
          <span>EduPay <strong>Malawi</strong></span>
          <small>Pay Fast, Pay Smart</small>
        </div>
      </div>

      <div class="auth-header">
        <h2>Headteacher Registration</h2>
        <p>Create your account to get started</p>
      </div>

      <form class="auth-form" id="headteacherSignupForm" novalidate>
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" class="form-input" id="htFirstName" placeholder="Enter first name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-input" id="htLastName" placeholder="Enter last name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="htEmail" placeholder="Enter email address" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="auth-phone-group">
            <span class="auth-phone-prefix">+265</span>
            <input type="tel" class="form-input auth-phone-input" id="htPhone" placeholder="Enter phone number" maxlength="9" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="auth-password-group">
            <input type="password" class="form-input" id="htPassword" placeholder="Enter password" required>
            <button type="button" class="password-toggle" data-target="htPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="auth-password-group">
            <input type="password" class="form-input" id="htConfirmPassword" placeholder="Confirm password" required>
            <button type="button" class="password-toggle" data-target="htConfirmPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-error" id="htSignupError"></div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login/">Login</a></p>
      </div>

    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
