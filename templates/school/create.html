{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create School - Edupay</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/logo.ico' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="nav-brand">
        <img src="{% static 'images/logo.png' %}" alt="Edupay" class="nav-brand-img">
        <div class="nav-brand-text">
          <span>EduPay <strong>Malawi</strong></span>
          <small>Pay Fast, Pay Smart</small>
        </div>
      </a>
    </div>
  </nav>

  <section class="page-section">
    <div class="container">

      <div class="page-header">
        <h1>Create Your School</h1>
      </div>

      <div class="breadcrumb">
        <a href="/">Home</a>
        <span>/</span>
        <span>Create School</span>
      </div>

      <div class="info-banner">
        <i class="fa-solid fa-info-circle"></i>
        <p>You need to register your school before you can access the dashboard. This only takes a minute.</p>
      </div>

      <div class="form-section">
        <h3 class="form-section-title">School Details</h3>

        <form class="auth-form" id="createSchoolForm" novalidate>
          <div class="form-group">
            <label class="form-label">School Name</label>
            <input type="text" class="form-input" id="schoolName" placeholder="Enter school name" required>
          </div>

          <div class="form-group">
            <label class="form-label">Location</label>
            <input type="text" class="form-input" id="schoolLocation" placeholder="Enter school location" required>
          </div>

          <div class="form-group">
            <label class="form-label">School Type</label>
            <select class="form-select" id="schoolType">
              <option value="" disabled selected>Select school type</option>
              <option value="primary">Primary School</option>
              <option value="secondary">Secondary School</option>
              <option value="university">University</option>
              <option value="college">College</option>
            </select>
          </div>

          <div class="form-error" id="createSchoolError"></div>

          <button type="submit" class="btn btn-primary btn-block">Create School</button>
        </form>
      </div>

    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
