{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Edupay</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/logo.ico' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="{% static 'images/logo.png' %}" alt="Edupay" class="auth-logo-img">
        <div class="auth-logo-text">
          <span>EduPay <strong>Malawi</strong></span>
          <small>Pay Fast, Pay Smart</small>
        </div>
      </div>

      <div class="auth-header">
        <h2>Change Password</h2>
        <p>You need to change your default password before continuing</p>
      </div>

      <div class="info-banner info-banner-warning">
        <i class="fa-solid fa-shield-halved"></i>
        <p>For security reasons, you must set a new password.</p>
      </div>

      <form class="auth-form" id="changePasswordForm" novalidate>
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <div class="auth-password-group">
            <input type="password" class="form-input" id="currentPassword" placeholder="Enter current password" required>
            <button type="button" class="password-toggle" data-target="currentPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="auth-password-group">
            <input type="password" class="form-input" id="newPassword" placeholder="Enter new password" required>
            <button type="button" class="password-toggle" data-target="newPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div class="auth-password-group">
            <input type="password" class="form-input" id="confirmNewPassword" placeholder="Confirm new password" required>
            <button type="button" class="password-toggle" data-target="confirmNewPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-error" id="changePasswordError"></div>

        <button type="submit" class="btn btn-primary btn-block">Save &amp; Continue</button>
      </form>

    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
