{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Edupay</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <i class="fa-solid fa-book"></i>
        <div class="auth-logo-text">
          <span>EduPay <strong>Malawi</strong></span>
          <small>Pay Fast, Pay Smart</small>
        </div>
      </div>

      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Login to your account</p>
      </div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="auth-phone-group">
            <span class="auth-phone-prefix">+265</span>
            <input type="tel" class="form-input auth-phone-input" id="loginPhone" placeholder="Enter phone number" maxlength="9" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="auth-password-group">
            <input type="password" class="form-input" id="loginPassword" placeholder="Enter password" required>
            <button type="button" class="password-toggle" data-target="loginPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-error" id="loginError"></div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup/">Sign Up</a></p>
      </div>

    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
