{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Edupay{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="{% url 'home' %}" class="nav-brand">Edu<span>pay</span></a>
      <a href="#" class="btn btn-primary btn-sm nav-cta-mobile">Pay Now</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="{% url 'home' %}">Home</a>
        <a href="#" class="btn btn-primary btn-sm nav-cta">Pay Now</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-brand">Edu<span>pay</span></div>
      <p>&copy; 2026 Edupay. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Support</a>
        <a href="#">Privacy</a>
      </div>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
